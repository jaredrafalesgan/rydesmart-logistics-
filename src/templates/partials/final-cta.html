{% import "macros.html" as m with context %}
    <!-- ===== Final call to action ===== -->
    <section class="final-cta">
      <div class="container final-cta__inner">
        <div>
          <h2>Looking for a reliable transportation partner?</h2>
          <p>Tell us about your freight and we'll confirm equipment and availability.</p>
        </div>
        <div class="final-cta__actions">
          <a href="{{ url('request-capacity') }}" class="btn btn--primary btn--lg"><span>Work With {{ company.name }}</span></a>
          <a href="tel:{{ company.phone_e164 }}" class="final-cta__call">{{ m.icon("phone") }} {{ company.phone }}</a>
        </div>
      </div>
    </section>
